name: BOAT EV EV画面実装

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZIP展開
        run: |
          rm -rf work verify
          mkdir work
          unzip -q boat-ev-render.zip -d work

      - name: EV実装
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 --decode > /tmp/patch.py
          python /tmp/patch.py

      - name: 構文と実装を検査
        run: |
          python -m py_compile work/app/nationwide_board_v09.py
          grep -q 'latest_odds_snapshot' work/app/nationwide_board_v09.py
          grep -q 'ev_status' work/app/nationwide_board_v09.py
          grep -q 'r.ev_status==="BUY"' work/app/pwa/app.js
          grep -q '推定確率' work/app/pwa/app.js
          grep -q '買い候補' work/app/pwa/index.html
          echo "PATCH CHECK OK"

      - name: 本番ZIPを再作成して再検査
        run: |
          cd work
          zip -qr ../boat-ev-render-new.zip .
          cd ..
          rm -rf verify
          mkdir verify
          unzip -q boat-ev-render-new.zip -d verify
          python -m py_compile verify/app/nationwide_board_v09.py
          grep -q 'ev_status' verify/app/nationwide_board_v09.py
          mv boat-ev-render-new.zip boat-ev-render.zip
          echo "FINAL ZIP CHECK OK"

      - name: 本番へコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boat-ev-render.zip
          git diff --cached --quiet && exit 0
          git commit -m "Implement P162 EV decision UI"
          git push
