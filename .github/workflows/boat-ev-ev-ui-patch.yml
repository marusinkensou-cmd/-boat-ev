name: BOAT EV EV画面実装

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ZIPを展開
        run: |
          rm -rf work
          mkdir work
          unzip -q boat-ev-render.zip -d work

      - name: EV判定を実用画面へ接続
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path("work/app/nationwide_board_v09.py")
          s=p.read_text()

          s=s.replace(
          'from prediction_v162 import predict_race',
          'from prediction_v162 import predict_race\nfrom ev_engine_v08 import latest_odds_snapshot, select_bets'
          )

          old='''        preds=pr.get("predictions",[])
          state="DATA" if pr.get("status")!="ok" else ("FINAL" if pr.get("stage")=="final" else "PRE")
          out.append({"race_id":rid,"venue":venue,"jcd":jcd,"race_no":rno,"deadline":dl.isoformat(),
          '''

          new='''        preds=pr.get("predictions",[])
          state="DATA" if pr.get("status")!="ok" else ("FINAL" if pr.get("stage")=="final" else "PRE")

          odds_at,odds_map=latest_odds_snapshot(con,rid)
          prob_map={
              str(x.get("combination")):float(x.get("predicted_prob"))
              for x in preds
              if x.get("combination") and x.get("predicted_prob") is not None
          }

          ev_bets=[]
          ev_rows=[]
          if prob_map and odds_map:
              ev_bets,ev_rows=select_bets(
                  prob_map,odds_map,
                  ev_threshold=1.10,
                  edge_threshold=0.10,
                  max_bets=6,
                  min_prob=0.01
              )

          if state=="DATA":
              ev_status="DATA"
              ev_label="判定不能"
          elif not odds_map:
              ev_status="NO_ODDS"
              ev_label="オッズ未取得"
          elif ev_bets:
              ev_status="BUY"
              ev_label="買い候補"
          else:
              ev_status="PASS"
              ev_label="見送り"

          best_ev=max(
              (x.get("ev") for x in ev_rows if x.get("ev") is not None),
              default=None
          )

          out.append({"race_id":rid,"venue":venue,"jcd":jcd,"race_no":rno,"deadline":dl.isoformat(),
          '''

          if old not in s:
              raise SystemExit("nationwide_board insertion point not found")
          s=s.replace(old,new,1)

          old2='''          "bets":preds,"predictions":preds,"bet_count":len(preds),"best_ev":None,
          '''

          new2='''          "bets":preds,"predictions":preds,"bet_count":len(preds),
          "ev_status":ev_status,"ev_label":ev_label,
          "ev_bets":ev_bets,"ev_rows":ev_rows,
          "odds_captured_at":odds_at,"best_ev":best_ev,
          '''

          if old2 not in s:
              raise SystemExit("nationwide_board output point not found")
          s=s.replace(old2,new2,1)
          p.write_text(s)

          p=Path("work/app/pwa/app.js")
          s=p.read_text()

          old='''  if(FILTER==="buy") return r.grade!=="PASS";
          if(FILTER==="pass") return r.grade==="PASS";
          if(FILTER==="buy") return r.prediction_state==="FINAL";
          if(FILTER==="pass") return r.prediction_state==="PRE";
          '''

          new='''  if(FILTER==="buy") return r.ev_status==="BUY";
          if(FILTER==="pass") return r.ev_status==="PASS";
          '''

          if old not in s:
              raise SystemExit("filter point not found")
          s=s.replace(old,new,1)

          old2='''    const stage=missing?"データ不足":(r.prediction_state==="FINAL"?"直前予想":"事前予想");
          '''

          new2='''    const stage=missing?"データ不足":(r.prediction_state==="FINAL"?"直前予想":"事前予想");
              const evLabel=r.ev_label||"判定不能";
              const evClass=r.ev_status||"DATA";
              const evRows=(r.ev_bets||[]).map(b=>
                `<div class="bet"><div class="combo">${esc(b.combination)}</div><span>確率 ${fmtPct(b.predicted_prob)} / オッズ ${Number(b.market_odds).toFixed(1)}倍 / EV ${Number(b.ev).toFixed(2)}</span><strong>${b.qualifies?"買い候補":""}</strong></div>`
              ).join("");
              const evSummary=r.ev_status==="NO_ODDS"
                ? `<div class="evbox NO_ODDS"><b>オッズ未取得</b><span>EV判定はまだ行いません</span></div>`
                : `<div class="evbox ${esc(evClass)}"><b>${esc(evLabel)}</b><span>${r.best_ev!=null?"最高EV "+Number(r.best_ev).toFixed(2):""}</span></div>`;
              const evDetails=evRows?`<details class="betDetails"><summary>EV買い候補を見る</summary>${evRows}</details>`:"";
          '''

          if old2 not in s:
              raise SystemExit("render insertion point not found")
          s=s.replace(old2,new2,1)

          old3='''${risk}${confLine}${formLine}${betDetails}${infoDetails}</section>`;'''
          new3='''${risk}${evSummary}${evDetails}${confLine}${formLine}${betDetails}${infoDetails}</section>`;'''

          if old3 not in s:
              raise SystemExit("card insertion point not found")
          s=s.replace(old3,new3,1)
          p.write_text(s)

          p=Path("work/app/pwa/index.html")
          s=p.read_text()

          s=s.replace(
          '<button data-filter="buy">直前予想</button>',
          '<button data-filter="buy">買い候補</button>'
          ).replace(
          '<button data-filter="pass">事前予想</button>',
          '<button data-filter="pass">見送り</button>'
          ).replace(
          '<div class="metric"><b id="buyCount">0</b><span>直前予想</span></div>',
          '<div class="metric"><b id="buyCount">0</b><span>買い候補</span></div>'
          ).replace(
          '<div class="metric"><b id="passCount">0</b><span>事前予想</span></div>',
          '<div class="metric"><b id="passCount">0</b><span>見送り</span></div>'
          )

          s=s.replace(
          '</style>',
          '''.evbox{margin:10px 0;padding:11px 12px;border:1px solid var(--line);border-radius:14px;display:flex;justify-content:space-between;align-items:center}
          .evbox b{font-size:18px}.evbox span{font-size:12px;color:var(--muted)}
          .evbox.BUY b{color:var(--good)}
          .evbox.PASS b{color:var(--pass)}
          .evbox.NO_ODDS b{color:var(--warn)}
          </style>'''
          )

          s=s.replace('/app.js?v=164','/app.js?v=168')
          p.write_text(s)
          PY

      - name: 構文チェック
        run: |
          python -m py_compile \
            work/app/nationwide_board_v09.py \
            work/app/ev_engine_v08.py \
            work/app/prediction_v162.py

      - name: ZIPを再作成
        run: |
          cd work
          zip -qr ../boat-ev-render-new.zip .
          cd ..
          mv boat-ev-render-new.zip boat-ev-render.zip

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boat-ev-render.zip
          git diff --cached --quiet && exit 0
          git commit -m "Connect P162 predictions to EV decision UI"
          git push
