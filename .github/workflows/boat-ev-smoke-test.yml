name: BOAT EV manual smoke test

on:
  workflow_dispatch:
    inputs:
      jcd:
        description: 'Venue JCD (default Toda 02)'
        required: false
        default: '02'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wake service
        run: |
          curl --fail --retry 3 --retry-delay 5 --max-time 120 \
            https://boat-ev-jp.onrender.com/ >/tmp/home.txt
          echo "HOME_OK"

      - name: Probe API routes
        env:
          JCD: ${{ inputs.jcd }}
        run: |
          set +e
          for path in \
            "/api/refresh?jcd=${JCD}" \
            "/api/refresh-live?jcd=${JCD}" \
            "/api/update?jcd=${JCD}" \
            "/api/board?jcd=${JCD}"; do
            echo "=== ${path} ==="
            code=$(curl -sS --retry 1 --max-time 240 -o /tmp/body.txt -w '%{http_code}' \
              "https://boat-ev-jp.onrender.com${path}")
            echo "HTTP=${code}"
            head -c 4000 /tmp/body.txt || true
            echo
          done
          exit 0
