name: BOAT EV manual smoke test

on:
  workflow_dispatch:
    inputs:
      jcd:
        description: 'Venue JCD (default Toda 02)'
        required: false
        default: '02'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live BOAT EV
        env:
          JCD: ${{ inputs.jcd }}
        run: |
          set +e
          OUT=smoke-result.txt
          : > "$OUT"
          echo "run_utc=$(date -u +%FT%TZ)" >> "$OUT"
          echo "jcd=${JCD}" >> "$OUT"
          echo >> "$OUT"
          for path in \
            "/" \
            "/api/refresh?jcd=${JCD}" \
            "/api/refresh-live?jcd=${JCD}" \
            "/api/update?jcd=${JCD}" \
            "/api/board?jcd=${JCD}"; do
            echo "=== ${path} ===" >> "$OUT"
            code=$(curl -sS --retry 2 --retry-delay 3 --max-time 240 \
              -o /tmp/body.txt -w '%{http_code}' \
              "https://boat-ev-jp.onrender.com${path}")
            echo "HTTP=${code}" >> "$OUT"
            head -c 12000 /tmp/body.txt >> "$OUT" 2>/dev/null || true
            echo >> "$OUT"
            echo >> "$OUT"
          done
          cat "$OUT"
          exit 0

      - name: Upload smoke result
        uses: actions/upload-artifact@v4
        with:
          name: boat-ev-smoke-result
          path: smoke-result.txt
          retention-days: 1
