name: BOAT EV manual smoke test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wake service
        run: |
          curl --fail --retry 3 --retry-delay 5 --max-time 120 \
            https://boat-ev-jp.onrender.com/ >/tmp/home.txt
          echo "HOME_OK"
      - name: Show response headers
        run: |
          curl -sS -I --retry 2 --max-time 60 https://boat-ev-jp.onrender.com/ | head -20
