name: BOAT EV odds diagnostic

on:
  workflow_dispatch:
    inputs:
      hd:
        description: YYYYMMDD
        required: true
        default: '20260825'
      jcd:
        description: venue code
        required: true
        default: '09'
      rno:
        description: race number
        required: true
        default: '1'
  push:
    paths:
      - '.github/workflows/boat-ev-odds-diagnostic.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install parser dependencies
        run: pip install beautifulsoup4
      - name: Diagnose official trifecta path
        env:
          HD: ${{ github.event.inputs.hd || '20260825' }}
          JCD: ${{ github.event.inputs.jcd || '09' }}
          RNO: ${{ github.event.inputs.rno || '1' }}
        run: |
          python - <<'PY' | tee odds-diagnostic.txt
          import os, sqlite3, sys, urllib.request
          from pathlib import Path
          sys.path.insert(0, str(Path('patches').resolve()))
          from official_live_v10 import parse_trifecta_odds, store_odds
          hd=os.environ['HD']; jcd=os.environ['JCD']; rno=int(os.environ['RNO'])
          url=f'https://www.boatrace.jp/owpc/pc/race/odds3t?rno={rno}&jcd={jcd}&hd={hd}'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; BOAT-EV-Diagnostic/1.0)','Accept-Language':'ja,en;q=0.7'})
          with urllib.request.urlopen(req,timeout=20) as r:
              raw=r.read(); status=getattr(r,'status',None)
          html=raw.decode('utf-8',errors='replace')
          print('URL',url); print('HTTP',status,'BYTES',len(raw)); print('ODDSPOINT_LITERAL',html.count('oddsPoint'))
          try:
              odds=parse_trifecta_odds(html)
          except Exception as e:
              print('PARSE_ERROR',type(e).__name__,str(e)); raise
          print('PARSED',len(odds),'123',odds.get('123'),'124',odds.get('124'),'132',odds.get('132'),'654',odds.get('654'))
          legal={f'{a}{b}{c}' for a in range(1,7) for b in range(1,7) for c in range(1,7) if len({a,b,c})==3}
          print('LEGAL_MATCH',set(odds)==legal,'MISSING',len(legal-set(odds)),'EXTRA',len(set(odds)-legal))
          con=sqlite3.connect(':memory:')
          con.executescript('CREATE TABLE odds_snapshots(id INTEGER PRIMARY KEY AUTOINCREMENT,race_id TEXT,fetched_at TEXT); CREATE TABLE odds_trifecta(snapshot_id INTEGER,first_boat INTEGER,second_boat INTEGER,third_boat INTEGER,odds REAL);')
          rid=f'{hd}-{jcd}-{rno:02d}'
          sid=store_odds(con,rid,odds)
          n=con.execute('SELECT COUNT(*) FROM odds_trifecta WHERE snapshot_id=?',(sid,)).fetchone()[0]
          print('DB_SNAPSHOT',sid,'DB_ROWS',n)
          assert len(odds)==120 and set(odds)==legal and n==120
          print('DIAGNOSTIC_OK')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boat-ev-odds-diagnostic
          path: odds-diagnostic.txt
