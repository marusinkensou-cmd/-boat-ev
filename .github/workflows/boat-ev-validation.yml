name: BOAT EV legacy validation (manual only)

on:
  workflow_dispatch:

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Run legacy validation manually
        run: |
          curl --fail --retry 2 --max-time 240 -X POST \
          "https://boat-ev-jp.onrender.com/api/validation-tick"
